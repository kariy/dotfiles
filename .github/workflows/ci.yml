name: CI

on:
  push:
    branches: [dotfiles]
  pull_request:
    branches: [dotfiles]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Run make all
        run: make all

      - name: Add cargo to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify tools are installed
        run: |
          echo "Checking tool installations..."
          failed=0

          for tool in bat starship tokei fd eza btop fzf hexyl zoxide rustup; do
            if command -v "$tool" > /dev/null 2>&1; then
              echo "  ✓ $tool"
            else
              echo "  ✗ $tool not found"
              failed=1
            fi
          done

          if [ -d "$HOME/.asdf" ]; then
            echo "  ✓ asdf"
          else
            echo "  ✗ asdf not found"
            failed=1
          fi

          if [ -d "$HOME/.nvm" ]; then
            echo "  ✓ nvm"
            . "$HOME/.nvm/nvm.sh"
            if command -v node > /dev/null 2>&1; then
              echo "  ✓ node $(node --version)"
            else
              echo "  ✗ node not found"
              failed=1
            fi
          else
            echo "  ✗ nvm not found"
            failed=1
          fi

          if [ "$failed" -eq 1 ]; then
            exit 1
          fi

      - name: Verify symlinks
        run: |
          echo "Checking symlinks..."
          DOTFILE_PATH="$(pwd)"
          failed=0

          check_symlink() {
            local target="$1"
            local expected="$2"

            if [ -L "$target" ]; then
              actual=$(readlink "$target")
              if [ "$actual" = "$expected" ]; then
                echo "  ✓ $target -> $expected"
              else
                echo "  ✗ $target -> $actual (expected $expected)"
                failed=1
              fi
            else
              echo "  ✗ $target is not a symlink"
              failed=1
            fi
          }

          # dotfiles in home directory
          check_symlink "$HOME/.zshrc" "$DOTFILE_PATH/zshrc"
          check_symlink "$HOME/.gitconfig" "$DOTFILE_PATH/gitconfig"
          check_symlink "$HOME/.git-completion.bash" "$DOTFILE_PATH/git-completion.bash"

          # zsh completions
          check_symlink "$HOME/.zsh/_git" "$DOTFILE_PATH/zsh/_git"

          # .config files
          check_symlink "$HOME/.config/starship.toml" "$DOTFILE_PATH/.config/starship.toml"
          check_symlink "$HOME/.config/skhd/skhdrc" "$DOTFILE_PATH/.config/skhd/skhdrc"
          check_symlink "$HOME/.config/yabai/yabairc" "$DOTFILE_PATH/.config/yabai/yabairc"
          check_symlink "$HOME/.config/zed/keymap.json" "$DOTFILE_PATH/.config/zed/keymap.json"
          check_symlink "$HOME/.config/zed/settings.json" "$DOTFILE_PATH/.config/zed/settings.json"

          # nvim
          check_symlink "$HOME/.config/nvim/init.vim" "$DOTFILE_PATH/nvim/init.vim"

          if [ "$failed" -eq 1 ]; then
            exit 1
          fi
